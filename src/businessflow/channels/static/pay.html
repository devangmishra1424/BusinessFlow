<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BusinessFlow · Pay</title>
<meta name="description" content="BusinessFlow: see what your loan needs, pay in one tap, and ask in English or Hindi." />
<meta name="theme-color" content="#005da8" />
<link rel="icon" type="image/svg+xml" href="/static/brand-mark.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/styles.css?v=15" />
</head>
<body>

<div class="pay-screen">
  <div class="pay-card">
    <div class="pay-card-head">
      <div class="brand small">
        <img class="brand-mark" src="/static/brand-mark.svg" alt="" />
        <div class="brand-name">Business<b class="brand-accent">Flow</b></div>
      </div>
      <span class="pay-badge">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 11V7a4 4 0 1 1 8 0v4" stroke="currentColor" stroke-width="2"/></svg>
        Payment
      </span>
    </div>

    <div class="pay-body">
      <div id="pay-loading" class="pay-state pay-loading">
        <div class="spinner"></div>
        <p>Loading your payment link…</p>
      </div>

      <div id="pay-pending" class="pay-state" hidden>
        <p class="pay-label">Confirm your payment</p>
        <p class="pay-amount" id="pay-amount"></p>
        <p class="pay-sub" id="pay-business"></p>
        <p class="pay-extra-note" id="pay-note" hidden></p>

        <!-- Only when the borrower chose to pay MORE than what is due (never for
             EMI + the late fee, which is simply what's owed). -->
        <div id="pay-overpay-question" class="pay-extra-question" hidden>
          <p class="pay-extra-note" id="pay-overpay-note-text"></p>
          <p class="pay-extra-prompt">How would you like to use the extra amount?</p>
          <div class="pay-scheme-actions">
            <button type="button" class="start-submit" id="pay-scheme-next-emi">Lower my next EMI</button>
            <button type="button" class="start-submit pay-scheme-alt" id="pay-scheme-reduce-emi">Lower my EMI amount from now on</button>
            <button type="button" class="start-submit pay-scheme-alt" id="pay-scheme-reduce-tenure">Finish the loan sooner</button>
          </div>
        </div>

        <button type="button" class="start-submit pay-confirm-btn" id="pay-confirm-btn">
          Confirm payment
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <p class="pay-hint">This is a demo payment -- no real money moves, but it really does record a real payment on your account.</p>
      </div>

      <div id="pay-success" class="pay-state" hidden>
        <div class="pay-check"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <p class="pay-label">Payment received</p>
        <p class="pay-amount" id="pay-success-amount"></p>
        <p class="pay-sub" id="pay-success-next"></p>
        <p class="pay-sub" id="pay-success-still-due" hidden></p>
        <p class="pay-hint">You can close this tab and go back to your account.</p>
      </div>

      <div id="pay-error" class="pay-state" hidden>
        <div class="pay-error-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 8v5m0 3.5h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/></svg></div>
        <p class="pay-label pay-label-error" id="pay-error-text"></p>
      </div>
    </div>
  </div>
</div>

<script src="/static/pay.js?v=5"></script>
</body>
</html>
