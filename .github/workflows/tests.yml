name: tests

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Real Groq/Postgres/ASR calls, no mocking -- this is genuinely slow
    # (observed ~2 hours locally with a warm model cache). Give it real
    # headroom rather than hitting GitHub's default 6h/job cap partway
    # through a run and losing the whole thing.
    timeout-minutes: 240
    env:
      # Every one of these is optional: tests that need it are gated by
      # their own pytest.mark.skipif and simply skip if it's unset,
      # exactly like running locally without a filled-in .env. Add the
      # real secrets under Settings -> Secrets and variables -> Actions
      # to actually exercise the Groq/Postgres/auth-gated tests in CI.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ALTERNATE_GROQ_KEY: ${{ secrets.ALTERNATE_GROQ_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Download the Piper English TTS voice model
        # en_US-lessac-medium.onnx (63MB) is deliberately not committed to
        # git -- only its small .onnx.json sidecar is tracked. A fresh
        # checkout (CI, or a new clone anywhere else) is missing it unless
        # something fetches it explicitly, which is exactly what caused
        # test_pipeline.py's two voice-roundtrip tests to fail with
        # onnxruntime.NoSuchFile on every run since this workflow existed.
        run: |
          curl -L -o data/models/piper/en_US-lessac-medium.onnx \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx"

      - name: Seed the policy knowledge base
        # The retriever tests assume this has already been run (same
        # requirement as running locally) -- data/kb/*.md is real,
        # tracked content, but the Chroma index built from it is not.
        run: python -m scripts.seed_kb

      - name: Run tests
        run: pytest tests/ -v
