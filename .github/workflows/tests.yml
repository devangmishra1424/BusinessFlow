name: tests

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Real Groq/ASR calls, no mocking -- this is genuinely slow (observed
    # ~2 hours locally with a warm model cache). Give it real headroom
    # rather than hitting GitHub's default 6h/job cap partway through a
    # run and losing the whole thing.
    timeout-minutes: 240
    # A fresh, disposable Postgres for every run -- NOT the shared
    # production Supabase database this project's VM and every
    # developer's own local testing also point at. Found live: this repo
    # ran CI against that one shared database for a while, and a CI run's
    # own reseed/test writes collided with real interactive testing more
    # than once (an escalation vanishing mid-demo, a payment token
    # 404ing, KB chunks getting purged out from under a developer -- all
    # traced back to this exact thing). Isolating CI's database is the
    # actual fix; retrying flaky-looking tests would only have treated
    # the symptom. pgvector/pgvector:pg16 (not plain postgres:16) because
    # schema.sql's document_chunks table needs the vector extension
    # available to install.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: businessflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # GROQ_API_KEY/ALTERNATE_GROQ_KEY are deliberately NOT set here.
      # Found live: this repo's only Groq keys are the same ones the
      # deployed bot uses in production, both capped at a shared 200,000
      # tokens/day (TPD) per model+org, not per key -- previously wiring
      # them in as CI secrets meant a single full test run (hundreds of
      # real, unmocked Groq-calling tests) could burn nearly the entire
      # daily budget by itself, so the live bot ran out mid-demo right
      # after any push. Every Groq-gated test already has its own
      # pytest.mark.skipif(not GROQ_API_KEY) and skips cleanly without
      # it -- exactly like a fresh clone with no .env filled in -- so
      # leaving this unset here is what keeps CI from ever competing with
      # production for the same quota. DATABASE_URL is NOT a secret --
      # it's this job's own disposable postgres service above, same on
      # every run, nothing production ever touches.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/businessflow_ci
      OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Apply schema.sql to the CI postgres
        # schema.sql is this project's own tracked reference schema (see
        # its own header comment) -- applying it here is what makes it a
        # real, tested contract instead of a snapshot nobody re-checks.
        run: psql "$DATABASE_URL" -f schema.sql

      - name: Download the Piper English TTS voice model
        # en_US-lessac-medium.onnx (63MB) is deliberately not committed to
        # git -- only its small .onnx.json sidecar is tracked. A fresh
        # checkout (CI, or a new clone anywhere else) is missing it unless
        # something fetches it explicitly, which is exactly what caused
        # test_pipeline.py's two voice-roundtrip tests to fail with
        # onnxruntime.NoSuchFile on every run since this workflow existed.
        run: |
          curl -L -o data/models/piper/en_US-lessac-medium.onnx \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx"

      - name: Seed the policy knowledge base
        # The retriever tests assume this has already been run (same
        # requirement as running locally) -- data/kb/*.md is real,
        # tracked content, but the pgvector index built from it is not,
        # and this job's postgres above starts genuinely empty every run.
        run: python -m scripts.seed_kb

      - name: Run tests
        run: pytest tests/ -v

  deploy:
    needs: pytest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest and restart services on the VM
        # The deploy key's authorized_keys entry on the VM has a forced
        # command -- whatever we send over ssh is ignored, and the VM
        # always runs its own fixed pull-and-restart sequence instead.
        # This means a leaked VM_SSH_KEY secret can only ever trigger that
        # one sequence, not an arbitrary command on the box.
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} deploy
